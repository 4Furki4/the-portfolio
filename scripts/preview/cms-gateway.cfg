global
  maxconn 128

defaults
  mode http
  timeout connect 5s
  timeout client 30s
  timeout server 30s

resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 10s

frontend cms_read_only
  bind :8055
  acl read_method method GET HEAD
  acl read_path path_beg /items/ /assets/ /files/
  acl ping_path path -i /server/ping
  http-request deny deny_status 403 unless read_method
  http-request deny deny_status 403 unless read_path or ping_path
  default_backend published_cms

backend published_cms
  server cms portfolio-cms:8055 check resolvers docker init-addr libc,none
